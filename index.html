var CATS=["全部","古裝","重生","豪門","家庭","玄幻","都市"];
var cat="全部";
function getWatched(){try{return JSON.parse(localStorage.getItem("aidrama_watched")||"[]")}catch(e){return[]}}
function setWatched(a){localStorage.setItem("aidrama_watched",JSON.stringify(a))}
function thumb(id){return "https://i.ytimg.com/vi/"+id+"/hqdefault.jpg"}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function renderChips(){
  document.getElementById("chips").innerHTML=CATS.map(function(c){
    return '<button class="chip'+(c===cat?' on':'')+'" data-c="'+c+'">'+c+'</button>';
  }).join("");
  document.querySelectorAll(".chip").forEach(function(b){
    b.addEventListener("click",function(){cat=b.dataset.c;renderChips();render();});
  });
}
function vpd(d){var days=Math.max(1,Math.round((Date.now()-new Date(d.pub))/86400000));return Math.round(d.vn/days)}
function fmtVpd(n){return n>=10000?(n/10000).toFixed(1)+" 萬/天":n+" /天"}
function render(){
  var q=(document.getElementById("q").value||"").trim();
  var month=document.getElementById("month").value;
  var list=DRAMAS.filter(function(d){
    return (cat==="全部"||d.c===cat)&&(!month||d.pub.indexOf(month)===0)&&(!q||(d.t+d.ch+d.desc).indexOf(q)>=0);
  });
  var sort=document.getElementById("sort").value;
  if(sort==="hot")list.sort(function(a,b){return b.vn-a.vn});
  else if(sort==="vpd")list.sort(function(a,b){return vpd(b)-vpd(a)});
  else list.sort(function(a,b){return (b.eps||0)-(a.eps||0)});
  var watched=getWatched();
  document.getElementById("count").textContent="共 "+list.length+" 部";
  var last=localStorage.getItem("aidrama_last");
  var cont=document.getElementById("continue");
  if(last){
    var ld=null;DRAMAS.forEach(function(d){if(d.id===last)ld=d});
    if(ld){cont.style.display="block";cont.innerHTML="繼續看：<b>"+esc(ld.t)+"</b> <a class=\"btn\" href=\"https://www.youtube.com/watch?v="+ld.id+"\" target=\"_blank\" rel=\"noopener\">到 YouTube 看</a>";}
    else cont.style.display="none";
  } else cont.style.display="none";
  document.getElementById("grid").innerHTML=list.map(function(d){
    var seen=watched.indexOf(d.id)>=0;
    return '<button class="card" onclick="openDrama(\''+d.id+'\')"><img src="'+thumb(d.id)+'" alt="" loading="lazy"><div class="card-body"><h3>'+esc(d.t)+'</h3><p><span class="badge">'+d.c+'</span>'+(d.eps?("共 "+d.eps+" 集（合集版）"):"合集版")+'｜片長 '+d.d+'｜'+d.pub.slice(0,7)+'上架</p><p>'+esc(d.desc)+'</p><p>'+esc(d.ch)+'｜'+d.v+' 觀看｜日均約 '+fmtVpd(vpd(d))+' '+(seen?'<span class="seen">✓ 看過</span>':'')+'</p></div></button>';
  }).join("")||"<p>沒有找到符合的劇，換個關鍵字試試。</p>";
}
function openDrama(id){
  var d=null;DRAMAS.forEach(function(x){if(x.id===id)d=x});
  if(!d)return;
  localStorage.setItem("aidrama_last",id);
  var watched=getWatched();var seen=watched.indexOf(id)>=0;
  var el=document.getElementById("detail");
  el.style.display="block";
  el.innerHTML='<h2>'+esc(d.t)+'</h2><p><span class="badge">'+d.c+'</span>'+esc(d.ch)+'｜'+d.v+' 觀看｜日均約 '+fmtVpd(vpd(d))+'｜片長 '+d.d+'｜'+d.pub+'上架 '+(d.eps?('｜共 '+d.eps+' 集（合集版，一支影片一次看完）'):'｜合集版')+'</p><p>'+esc(d.desc)+'</p><a class="btn" href="https://www.youtube.com/watch?v='+d.id+'" target="_blank" rel="noopener">▶ 到 YouTube 看</a><p class="note">點上面按鈕會跳到 YouTube App 或網頁播放；這是合集版影片，集數以影片內的章節為準。</p><button class="btn ghost" onclick="toggleSeen(\''+d.id+'\')">'+(seen?'取消看過標記':'標記為看過')+'</button> <button class="btn ghost" onclick="document.getElementById(\'detail\').style.display=\'none\'">收起</button>';
  el.scrollIntoView({behavior:"smooth"});
  render();
}
function toggleSeen(id){
  var w=getWatched();var i=w.indexOf(id);
  if(i>=0)w.splice(i,1);else w.push(id);
  setWatched(w);openDrama(id);
}
document.getElementById("q").addEventListener("input",render);
document.getElementById("sort").addEventListener("change",render);
document.getElementById("month").addEventListener("change",render);
renderChips();render();
</script>
